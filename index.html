<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>SearnN Web</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background: #0a0e27;
            color: #00ff41;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2em;
            color: #00ff41;
            text-shadow: 0 0 10px #00ff41;
        }
        
        .search-box {
            background: #0f1535;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
            border: 1px solid #00ff41;
        }
        
        input {
            width: 80%;
            padding: 10px;
            background: #000;
            color: #00ff41;
            border: 1px solid #00ff41;
            font-family: 'Courier New', monospace;
            font-size: 16px;
        }
        
        button {
            padding: 10px 20px;
            background: #00ff41;
            color: #000;
            border: none;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            cursor: pointer;
            margin-left: 10px;
        }
        
        button:hover {
            background: #00cc33;
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .output {
            background: #000;
            border: 1px solid #00ff41;
            border-radius: 5px;
            padding: 20px;
            height: 70vh;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }
        
        .line {
            padding: 2px 0;
            white-space: pre-wrap;
            word-wrap: break-word;
            border-bottom: 1px solid #0f1535;
        }
        
        .line:hover {
            background: #0f1535;
        }
        
        a {
            color: #00ff41;
            text-decoration: none;
        }
        
        a:hover {
            text-decoration: underline;
        }
        
        .status {
            margin-top: 10px;
            font-size: 12px;
            color: #ffaa00;
        }
        
        ::-webkit-scrollbar {
            width: 10px;
        }
        
        ::-webkit-scrollbar-track {
            background: #0a0e27;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #00ff41;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 SearnN Web</h1>
            <p>Multi-Engine Search | Real-time Results</p>
        </div>
        
        <div class="search-box">
            <input type="text" id="query" placeholder="Enter search query..." />
            <button id="searchBtn">START</button>
            <button id="clearBtn" style="background:#666; color:#fff;">CLEAR</button>
            <div class="status" id="status"></div>
        </div>
        
        <div class="output" id="output">
            <div class="line">> Ready to search...</div>
        </div>
    </div>
    
    <script>
        let eventSource = null;
        
        const output = document.getElementById('output');
        const queryInput = document.getElementById('query');
        const searchBtn = document.getElementById('searchBtn');
        const clearBtn = document.getElementById('clearBtn');
        const statusDiv = document.getElementById('status');
        
        function addLine(text) {
            const line = document.createElement('div');
            line.className = 'line';
            
            // Convert URLs to clickable links
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            line.innerHTML = text.replace(urlRegex, (url) => {
                return `<a href="${url}" target="_blank">${url}</a>`;
            });
            
            output.appendChild(line);
            line.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
        
        function clearOutput() {
            output.innerHTML = '<div class="line">> Ready to search...</div>';
        }
        
        function startSearch() {
            const query = queryInput.value.trim();
            if (!query) {
                alert('Please enter a search query');
                return;
            }
            
            clearOutput();
            addLine(`> Starting search for: ${query}`);
            addLine(`> Connecting to search engines...\n`);
            
            searchBtn.disabled = true;
            statusDiv.innerHTML = '🟢 SEARCHING... (this may take a few minutes)';
            
            if (eventSource) {
                eventSource.close();
            }
            
            eventSource = new EventSource(`/stream?q=${encodeURIComponent(query)}`);
            
            eventSource.onmessage = function(event) {
                const data = JSON.parse(event.data);
                if (data.line) {
                    if (data.line === '[DONE]') {
                        eventSource.close();
                        searchBtn.disabled = false;
                        statusDiv.innerHTML = '✅ SEARCH COMPLETE';
                        addLine('\n> Search finished!');
                    } else if (data.line !== '') {
                        addLine(data.line);
                    }
                }
            };
            
            eventSource.onerror = function() {
                eventSource.close();
                searchBtn.disabled = false;
                statusDiv.innerHTML = '❌ CONNECTION ERROR';
                addLine('\n> Error: Connection lost');
            };
        }
        
        searchBtn.addEventListener('click', startSearch);
        clearBtn.addEventListener('click', clearOutput);
        
        queryInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                startSearch();
            }
        });
    </script>
</body>
</html>
